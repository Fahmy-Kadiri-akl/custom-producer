name: Build
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Get dependencies
        run: go mod download

      - name: Get golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      - name: Lint
        run: golangci-lint run --timeout 3m0s ./...

  build-rotator:
    name: "Build Rotator"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check out code
        uses: actions/checkout@v4

      - name: Build
        run: CGO_ENABLED=0 go build -o rotator-binary ./rotator/bin/cmd

      - name: Vet
        run: go vet ./...

  vulncheck:
    name: "Vulnerability Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check out code
        uses: actions/checkout@v4

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
