name: Update Dependencies

on:
  schedule:
    # First Monday of every month at 09:00 UTC
    - cron: "0 9 1-7 * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-go-deps:
    name: "Go Dependencies"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Update all dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check for changes
        id: diff
        run: |
          cd ..
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "update go dependencies"
          title: "update go dependencies"
          body: |
            Automated monthly dependency update.

            - Ran `go get -u ./...` and `go mod tidy`
            - Passed `govulncheck`, `go build`, and `go vet`

            Review the diff for breaking changes before merging.
          branch: auto/update-deps
          delete-branch: true
